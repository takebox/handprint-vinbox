apiVersion: v2
name: agent-vinbox
description: |
  Helm chart for running the Handprint agent-vinbox all-in-one image
  (frontend + agent-server + automation) as a StatefulSet with persistent
  storage, ingress, and optional cluster RBAC.
type: application
# Chart-level version. Bump on chart changes.
version: 0.1.0
# Default appVersion pins the published agent-vinbox image tag from
# config/defaults.json (`versions.agentVinbox`). Override via
# `--set image.tag=...` to pull a different build (e.g. `main`, `latest`,
# or a `sha-<git-sha>` tag).
# Kept in sync by release-please (extra-files, type `generic`) — do not edit by
# hand; the trailing annotation is what marks this line for replacement.
appVersion: "1.25.0" # x-release-please-version
kubeVersion: ">=1.24.0-0"
home: https://github.com/HandPrint-AI/Handprint
sources:
  - https://github.com/HandPrint-AI/Handprint
keywords:
  - handprint
  - agent
  - ai
  - agent-vinbox
maintainers:
  - name: Handprint
    url: https://github.com/HandPrint-AI
